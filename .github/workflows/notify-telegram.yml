name: Notify Telegram

# Fallback sender, manual only. The live sender is scripts/notify-telegram.sh
# on the refresh VM, called by refresh-run.sh step 7b (see "Telegram
# notification" in README.md).
#
# The `push:` trigger was removed 2026-08-21. Both senders firing means every
# refresh notifies twice; the VM is preferred because this workflow depends on
# GitHub Actions being willing to start a job, and between 2026-08-19 and
# 2026-08-20 it refused five in a row on a billing hold while the refresh
# itself published normally — the digests were simply lost, silently.
#
# Restoring the trigger is the rollback: put the `push:` block back and unset
# JOBS_REFRESH_NOTIFY_ENABLED on the VM, in that order.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if nothing changed (for testing)"
        type: boolean
        default: false

# Read-only. This workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: notify-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with one commit of history
        uses: actions/checkout@v5
        with:
          # Need the parent commit to diff against.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Extract the previous jobs.json
        id: prev
        run: |
          set -euo pipefail
          # On the very first push, or if the parent did not contain the file,
          # fall back to "-" which suppresses the additions list.
          if git rev-parse HEAD~1 >/dev/null 2>&1 &&
             git cat-file -e HEAD~1:public/data/jobs.json 2>/dev/null; then
            git show HEAD~1:public/data/jobs.json > /tmp/prev-jobs.json
            echo "path=/tmp/prev-jobs.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=-" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous jobs.json — additions will be suppressed."
          fi

      - name: Build the message
        id: diff
        run: |
          RUN_ARG=""
          [ -f public/data/last-run.json ] && RUN_ARG="public/data/last-run.json"
          node scripts/notify-diff.mjs "${{ steps.prev.outputs.path }}" \
               public/data/jobs.json $RUN_ARG

      - name: Send to Telegram
        if: steps.diff.outputs.changed == 'true' || inputs.force
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.diff.outputs.message }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi
          # --fail-with-body so a Telegram API error surfaces in the log instead
          # of silently succeeding. The token never appears in the log.
          #
          # The response goes to a file rather than through `| head -c 400`:
          # head closes the pipe as soon as it has its 400 bytes, curl dies
          # with EPIPE (exit 23) on the rest of the body, and pipefail turns
          # that into a failed step even though the message was delivered.
          # Telegram echoes the whole message text back in the JSON, so the
          # body is several KB and the race is real but intermittent —
          # 2026-08-17 01:19 and 07:29 both sent (message_id 81, 82) and both
          # reported exit 23, after weeks of winning the same coin flip.
          RESPONSE="$(mktemp)"
          STATUS=0
          curl --silent --show-error --fail-with-body \
               -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
               -d chat_id="${CHAT_ID}" \
               -d parse_mode="HTML" \
               -d disable_web_page_preview="true" \
               --data-urlencode "text=${MESSAGE}" \
               --output "$RESPONSE" || STATUS=$?
          # Print the body before propagating a curl failure, so an API error
          # is still visible in the log — that is the point of
          # --fail-with-body, and `set -e` would otherwise abort first.
          head -c 400 "$RESPONSE"
          echo
          exit "$STATUS"

      - name: Nothing to report
        if: steps.diff.outputs.changed != 'true' && !inputs.force
        run: echo "::notice::No added, removed, promoted or newly archived jobs — no message sent."
